name: AltStore PAL upload
# Builds the AltStore PAL flavor (DIST-18-03) and uploads it to App Store Connect. With `submit` on, the same job then
# submits it for notarization (owner decisions, 2026-11-26): it waits until App Store Connect has processed the build,
# creates the version with review type Notarization (or reuses an editable one), attaches the build and submits it.
# Once Apple accepts it, publish-pal.yml publishes the package with the ADP ID the collaborator shares.
#
# Two ways in. deploy.yml calls it after each release with `submit` on (owner decision, 2026-11-26), so the PAL build
# carries the release's commit, version and build number (D-26). It can also be started by hand, from any branch, to
# upload a marketplace build without a release, a resubmission or a check of the signing and upload path; there
# `submit` is off unless the dispatch turns it on. GitHub offers a hand dispatch only for workflows on the default
# branch, so that needs this file on main. Either way it publishes nothing: no GitHub release, no source on main, no
# announcement.
#
# Its own archive with Config/Marketplace.xcconfig, signed by Xcode through the generated signing xcconfig. The job
# runs in the GitHub environment `app-marketplace`, whose required reviewer gives the owner's OK for each run (D-07).
# The wait and the submission run in this same job, so one OK covers the whole run. The signing material is removed
# right after the upload; only the API key stays, until the last step.
# Its secrets are the only place the signing material and the API key exist:
#   APP_STORE_CONNECT_KEY_ID              the App Store Connect API key's ID
#   APP_STORE_CONNECT_ISSUER_ID           the key's issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY         the key's .p8 file, as text
#   DISTRIBUTION_CERTIFICATE              the Apple Distribution certificate and its private key, a base64 .p12
#   DISTRIBUTION_CERTIFICATE_PASSWORD     the .p12's password
#   PROVISIONING_PROFILE_APP              the App Store Connect profile for app.ehpanda.store, base64
#   PROVISIONING_PROFILE_SHARE_EXTENSION  the App Store Connect profile for app.ehpanda.store.ShareExtension, base64
#   APPLE_TEAM_ID                         the team that owns the certificate and the profiles
# It also reads the repository variable ALTSTORE_PAL_MARKETPLACE_ID, the app's Apple ID in App Store Connect (also
# the PAL source's marketplaceID), kept at repository level because publish-pal.yml, which runs in no environment,
# reads it too. The archive also reads the repository secrets TELEMETRYDECK_APP_ID, TELEMETRYDECK_SALT and
# SENTRY_DSN (crash reporting), and its dSYM upload the repository secret SENTRY_AUTH_TOKEN and the repository
# variables SENTRY_ORGANIZATION, SENTRY_PROJECT and SENTRY_URL. deploy.yml passes the repository secrets with
# `secrets: inherit`; the environment's secrets come from the job's `environment`.
#
# Nothing here creates an App ID, certificate, profile or key: signing is manual with the profiles above, and
# actions-tool/asc.py refuses every endpoint outside its allow-list (D-07). Its calls are recorded with the key's ID
# and uploaded as an artifact (D-21); the upload uses the same key.
on:
  # Deploy passes submit: true; a hand dispatch submits only when asked (owner decision, 2026-11-26).
  workflow_call:
    inputs:
      submit:
        description: 'Submit the uploaded build for notarization'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the uploaded build for notarization'
        required: false
        type: boolean
        default: false
env:
  SCHEME_NAME: 'EhPanda'
  CHECK_BUILD_NUMBER_SCRIPT_PATH: './actions-tool/check-build-number.sh'
  UPLOAD_DSYMS_SCRIPT_PATH: './actions-tool/upload-dsyms.sh'

jobs:
  AltStorePAL:
    runs-on: xcode-27
    environment: app-marketplace
    # The build and upload (about 16 minutes for 3.1.0 (164)), App Store Connect's processing of the build (up to 90
    # minutes here) and the submission.
    timeout-minutes: 240
    # One upload at a time: queue, never cancel.
    concurrency:
      group: pal-upload
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ASC_APP_ID: ${{ vars.ALTSTORE_PAL_MARKETPLACE_ID }}
      ALTSTORE_PAL_JSON_PATH: './AltStorePAL.json'
      ASC_TOOL_PATH: './actions-tool/asc.py'
      SIGNING_SCRIPT_PATH: './actions-tool/marketplace-signing.sh'
      # The marketplace flavor (Config/Marketplace.xcconfig, included by the generated signing xcconfig).
      MARKETPLACE_BUNDLE_ID: 'app.ehpanda.store'
      MARKETPLACE_URL_SCHEME: 'ehpanda-marketplace'
      # Its own archive: the Classic archive is never reused or re-signed (owner decision).
      PAL_ARCHIVE_PATH: '/tmp/action-builds/EhPanda-AltStorePAL.xcarchive'
      PAL_EXPORT_PATH: '/tmp/action-builds/EhPanda-AltStorePAL-export'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Snapshot gate off for 3.0 (owner decision); restore by re-adding the snapshot-gate job and the require step
      # (see git history of this commit).
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::The ALTSTORE_PAL_MARKETPLACE_ID variable is not set to the app's Apple ID."; exit 1; }
          # The release's version, read from the project as Deploy's build gets it: every app and extension
          # target carries the same MARKETING_VERSION; test targets carry 1.0.
          versions="$(grep -Eo 'MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;' EhPanda.xcodeproj/project.pbxproj | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)"
          [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The project's targets do not share one MARKETING_VERSION: '$(tr '\n' ' ' <<< "$versions")'."; exit 1; }
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "The project is version $versions."
      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash "$SIGNING_SCRIPT_PATH" api-key
          # D-21: every App Store Connect call of this run is appended here and uploaded at the end.
          echo "ASC_CALL_RECORD=$RUNNER_TEMP/asc-calls.jsonl" >> "$GITHUB_ENV"
      - name: Check build number
        id: build-number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The PAL source as published on main. The Classic sources are not compared: the PAL build carries the
          # Classic release's build number (D-26).
          published_path="$RUNNER_TEMP/published"
          mkdir -p "$published_path"
          git fetch --no-tags --depth 1 origin main
          if git cat-file -e "FETCH_HEAD:${ALTSTORE_PAL_JSON_PATH#./}" 2>/dev/null; then
            git show "FETCH_HEAD:${ALTSTORE_PAL_JSON_PATH#./}" > "$published_path/$(basename "$ALTSTORE_PAL_JSON_PATH")"
          fi
          # Every app and extension target carries the same build number; test targets carry 1.
          build_version="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+;' EhPanda.xcodeproj/project.pbxproj | grep -Eo '[0-9]+' | sort -n | tail -1)"
          bash "$CHECK_BUILD_NUMBER_SCRIPT_PATH" "$build_version" "$published_path"/*.json
          # Build numbers are single-use in App Store Connect, uploaded or not (Research pitfall 2).
          python3 "$ASC_TOOL_PATH" check-build --app "$ASC_APP_ID" --version "$VERSION" --build "$build_version"
          echo "build=$build_version" >> "$GITHUB_OUTPUT"
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PROVISIONING_PROFILE_SHARE_EXTENSION: ${{ secrets.PROVISIONING_PROFILE_SHARE_EXTENSION }}
        run: bash "$SIGNING_SCRIPT_PATH" setup
      - name: Xcode archive
        env:
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          TELEMETRYDECK_SALT: ${{ secrets.TELEMETRYDECK_SALT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          # The generated xcconfig includes Config/Marketplace.xcconfig and selects each target's profile. The
          # channel stamp is a build setting there: a signed build is never stamped afterwards.
          xcodebuild archive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PAL_ARCHIVE_PATH" \
            -xcconfig "$MARKETPLACE_XCCONFIG" \
            OTHER_CODE_SIGN_FLAGS="--keychain $MARKETPLACE_KEYCHAIN" \
            GCC_OPTIMIZATION_LEVEL=s \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            TELEMETRYDECK_APP_ID="$TELEMETRYDECK_APP_ID" \
            TELEMETRYDECK_SALT="$TELEMETRYDECK_SALT" \
            SENTRY_DSN="$SENTRY_DSN"
      - name: Verify analytics credentials
        run: |
          app_info_plist="$PAL_ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app/Info.plist"
          app_id="$(plutil -extract TelemetryDeckAppID raw -o - "$app_info_plist")"
          salt="$(plutil -extract TelemetryDeckSalt raw -o - "$app_info_plist")"
          [[ ! -z "$app_id" ]] || exit 1
          [[ ! -z "$salt" ]] || exit 1
      - name: Verify crash reporting DSN
        run: |
          app_info_plist="$PAL_ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app/Info.plist"
          dsn="$(plutil -extract SentryDSN raw -o - "$app_info_plist" 2>/dev/null || true)"
          [[ "$dsn" == https://* ]] || { echo "::error::The archive carries no crash reporting DSN. Set the repository secret SENTRY_DSN."; exit 1; }
      - name: Verify marketplace build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$PAL_ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app"
          extension_path="$app_path/PlugIns/ShareExtension.appex"
          app_info_plist="$app_path/Info.plist"
          extension_info_plist="$extension_path/Info.plist"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app_info_plist")"
          extension_bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$extension_info_plist")"
          display_name="$(plutil -extract CFBundleDisplayName raw -o - "$app_info_plist")"
          url_scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$app_info_plist")"
          extension_url_scheme="$(plutil -extract EhPandaURLScheme raw -o - "$extension_info_plist")"
          channel="$(plutil -extract EhPandaDistributionChannel raw -o - "$app_info_plist")"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$app_info_plist")"

          [[ "$bundle_id" == "$MARKETPLACE_BUNDLE_ID" ]] || { echo "::error::The app is $bundle_id, not $MARKETPLACE_BUNDLE_ID."; exit 1; }
          [[ "$extension_bundle_id" == "$MARKETPLACE_BUNDLE_ID.ShareExtension" ]] || { echo "::error::The share extension is $extension_bundle_id."; exit 1; }
          [[ "$display_name" == "EhPanda" ]] || { echo "::error::The marketplace build is named '$display_name', not 'EhPanda'."; exit 1; }
          [[ "$url_scheme" == "$MARKETPLACE_URL_SCHEME" ]] || { echo "::error::The marketplace build registers '$url_scheme', not $MARKETPLACE_URL_SCHEME."; exit 1; }
          [[ "$extension_url_scheme" == "$url_scheme" ]] || { echo "::error::The share extension hands off to $extension_url_scheme, not $url_scheme."; exit 1; }
          [[ "$channel" == "altstorePAL" ]] || { echo "::error::The build is stamped '$channel', not altstorePAL."; exit 1; }
          [[ "$version" == "$VERSION" ]] || { echo "::error::The build is version $version, not $VERSION."; exit 1; }
          [[ "$build_version" == "$BUILD_NUMBER" ]] || { echo "::error::The build is number $build_version, not $BUILD_NUMBER."; exit 1; }
          [[ -f "$app_path/PrivacyInfo.xcprivacy" ]] || { echo "::error::The app has no PrivacyInfo.xcprivacy."; exit 1; }

          codesign --verify --deep --strict "$app_path"
          for bundle in "$app_path" "$extension_path"; do
            details="$(codesign -dvv "$bundle" 2>&1)"
            grep -q '^Authority=Apple Distribution: ' <<< "$details" || { echo "::error::$(basename "$bundle") is not signed by an Apple Distribution certificate."; exit 1; }
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details" || { echo "::error::$(basename "$bundle") is not signed by APPLE_TEAM_ID."; exit 1; }
            [[ -f "$bundle/embedded.mobileprovision" ]] || { echo "::error::$(basename "$bundle") has no provisioning profile."; exit 1; }
            entitlements="$RUNNER_TEMP/entitlements.plist"
            codesign -d --entitlements - --xml "$bundle" > "$entitlements" 2>/dev/null
            if [[ "$(plutil -extract get-task-allow raw -o - "$entitlements" 2>/dev/null || echo false)" != "false" ]]; then
              echo "::error::$(basename "$bundle") is signed for debugging (get-task-allow)."
              exit 1
            fi
          done
          bash "$CHECK_BUILD_NUMBER_SCRIPT_PATH" "$build_version" "$RUNNER_TEMP/published"/*.json
      - name: Upload dSYMs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORGANIZATION: ${{ vars.SENTRY_ORGANIZATION }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: bash "$UPLOAD_DSYMS_SCRIPT_PATH" "$PAL_ARCHIVE_PATH"
      - name: Keep the dSYMs
        uses: actions/upload-artifact@v7
        with:
          name: EhPanda-AltStorePAL-dSYMs
          path: ${{ env.PAL_ARCHIVE_PATH }}/dSYMs
      - name: Export and upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          # destination upload: xcodebuild signs the export with the profiles named in the export options and
          # sends it to App Store Connect with the API key.
          xcodebuild -exportArchive \
            -archivePath "$PAL_ARCHIVE_PATH" \
            -exportOptionsPlist "$MARKETPLACE_EXPORT_OPTIONS" \
            -exportPath "$PAL_EXPORT_PATH" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          # With submit on (the release path, owner decision 2026-11-26), the steps after the signing teardown
          # submit the build; otherwise the run ends with the upload.
          {
            echo "### AltStore PAL $VERSION ($BUILD_NUMBER) uploaded"
            echo ""
            if [[ "$SUBMIT" == "true" ]]; then
              echo "This run now waits for App Store Connect to process the build, then submits it for notarization."
            else
              echo "Submit was off for this run, so nothing was submitted. The collaborator can add this build to version $VERSION in App Store Connect, with review type Notarization, and submit it there. Once Apple accepts it, run Publish AltStore PAL with the ADP ID."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The signing material goes as soon as the upload is done (owner decision, 2026-11-26): the wait and the
      # submission need only the API key, which the last step removes.
      - name: Tear down signing
        if: always()
        run: bash "$SIGNING_SCRIPT_PATH" teardown-signing
      - name: Wait for the build
        id: wait-build
        if: inputs.submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
        run: |
          set -euo pipefail
          # App Store Connect processes an upload before a version can take it, which can take tens of minutes.
          build_id="$(python3 "$ASC_TOOL_PATH" wait-build --app "$ASC_APP_ID" --version "$VERSION" --build "$BUILD_NUMBER" --timeout 5400)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Ensure the notarization version
        id: ensure-version
        if: inputs.submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Review type NOTARIZATION and manual release; an existing version with another review type, or one in
          # review, is refused.
          version_id="$(python3 "$ASC_TOOL_PATH" ensure-version --app "$ASC_APP_ID" --version "$VERSION")"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Attach the build
        if: inputs.submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION_ID: ${{ steps.ensure-version.outputs.version_id }}
          BUILD_ID: ${{ steps.wait-build.outputs.build_id }}
        run: python3 "$ASC_TOOL_PATH" attach-build --version-id "$VERSION_ID" --build-id "$BUILD_ID"
      - name: Submit for notarization
        if: inputs.submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
          VERSION_ID: ${{ steps.ensure-version.outputs.version_id }}
        run: |
          set -euo pipefail
          submission_id="$(python3 "$ASC_TOOL_PATH" submit --app "$ASC_APP_ID" --version-id "$VERSION_ID")"
          {
            echo "### AltStore PAL $VERSION ($BUILD_NUMBER) submitted for notarization"
            echo ""
            echo "Review submission \`$submission_id\`. Once Apple accepts it, run Publish AltStore PAL with the ADP ID the collaborator shares."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the call record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asc-call-record-${{ steps.version.outputs.version }}-upload
          path: ${{ runner.temp }}/asc-calls.jsonl
          if-no-files-found: ignore
      - name: Remove the API key
        if: always()
        run: bash "$SIGNING_SCRIPT_PATH" teardown
