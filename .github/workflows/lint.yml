name: Lint
# Runs whenever Test does: pushes to branches only, never a tag, and not for a commit that skips the tests.
#
# Fails on a compiler warning or error and on a SwiftLint violation of any severity, in any target: the app, the
# share extension, every module and test target of the package, the app-hosted tests and the UI tests
# (Scripts/lint/lint_check.py). Test builds the same sources, but a warning does not fail a build, and the UI tests
# are not in its plan.
#
# A warning inside a third-party package is listed and allowed: only where the warning is counts. One that this
# repository's code triggers fails, whichever library defined it.
#
# Before the build it runs what needs no simulator: the tests of every script directory and the audit that no
# cookie is logged in the clear.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Lint:
    runs-on: xcode-27
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Every directory that holds a `test_*.py` is found here, not listed: a test file or a directory added later
      # runs without anyone naming it. The screenshot check names its own files by pattern (snapshot-gate.yml), and
      # 250 tests of Scripts/visual that the pattern did not match ran nowhere, like the 27 of Scripts/live-check.
      - name: Test the scripts
        run: |
          failed=0
          while IFS= read -r directory; do
            echo "::group::$directory"
            python3 -m unittest discover -s "$directory" -p 'test_*.py' || failed=1
            echo "::endgroup::"
          done < <(find Scripts actions-tool -name 'test_*.py' -exec dirname {} \; | sort -u)
          exit "$failed"
      # A log line that carries a cookie must mark it private. The audit's own fixtures first, then the sources.
      - name: Check that no cookie is logged in the clear
        run: |
          Scripts/Tests/check-cookie-logging-tests.sh
          Scripts/check-cookie-logging.sh
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build every target and lint every module
        run: python3 Scripts/lint/lint_check.py --output "$RUNNER_TEMP/lint"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs
          path: |
            ${{ runner.temp }}/lint/*.log
            ${{ runner.temp }}/lint/*.txt
          if-no-files-found: ignore
