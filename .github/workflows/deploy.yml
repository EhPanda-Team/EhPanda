name: Deploy
# Started by hand on main only, after the release pull request is merged (owner decision). Merging or
# pushing to main never releases. The title and notes come from ReleaseNotes/<version>.md (owner
# decision), so nothing is typed in or read from a pull request.
#
# Two jobs. `Deploy` makes the release: the archive, the GitHub release, AltStore.json and SideStore.json on main,
# and the Telegram and Discord posts. `AltStorePAL` then builds the AltStore PAL flavor (DIST-18-03) from the same
# commit: its own archive with Config/Marketplace.xcconfig, signed by Xcode through the generated signing xcconfig,
# with the release's version and build number (D-26). It uploads that build to App Store Connect and stops (owner
# decision, 2026-11-21): the collaborator creates the version with review type Notarization, adds the build and
# submits it in App Store Connect. Once Apple accepts it, publish-pal.yml publishes the package.
#
# `AltStorePAL` runs in the GitHub environment `pal-notarization`, whose required reviewer gives the owner's OK for
# each run (D-07). Its secrets are the only place the signing material and the API key exist:
#   APP_STORE_CONNECT_KEY_ID              the App Store Connect API key's ID
#   APP_STORE_CONNECT_ISSUER_ID           the key's issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY         the key's .p8 file, as text
#   DISTRIBUTION_CERTIFICATE              the Apple Distribution certificate and its private key, a base64 .p12
#   DISTRIBUTION_CERTIFICATE_PASSWORD     the .p12's password
#   PROVISIONING_PROFILE_APP              the App Store Connect profile for app.ehpanda.store, base64
#   PROVISIONING_PROFILE_SHARE_EXTENSION  the App Store Connect profile for app.ehpanda.store.ShareExtension, base64
#   APPLE_TEAM_ID                         the team that owns the certificate and the profiles
# Its variables:
#   ALTSTORE_PAL_MARKETPLACE_ID           the app's Apple ID in App Store Connect (also the PAL source's marketplaceID)
#   APP_STORE_CONNECT_KEY_ROLE            the key's role as recorded when it was made (D-21; written to the call record)
# The PAL archive also reads the repository secrets TELEMETRYDECK_APP_ID and TELEMETRYDECK_SALT, as Deploy's archive
# does.
#
# Nothing here creates an App ID, certificate, profile or key: signing is manual with the profiles above, and
# actions-tool/asc.py refuses every endpoint outside its allow-list (D-07). Its calls are recorded with the key's ID
# and role and uploaded as an artifact (D-21); the upload uses the same key.
on:
  workflow_dispatch:
env:
  SCHEME_NAME: 'EhPanda'
  ALTSTORE_JSON_PATH: './AltStore.json'
  SIDESTORE_JSON_PATH: './SideStore.json'
  ALTSTORE_BETA_JSON_PATH: './AltStoreBeta.json'
  CHECK_BUILD_NUMBER_SCRIPT_PATH: './actions-tool/check-build-number.sh'
  SIDESTORE_TEMPLATE_PATH: './actions-tool/sidestore.template.json'
  SOURCE_FILTER_PATH: './actions-tool/altstore-add-version.jq'
  PACKAGE_CHANNEL_SCRIPT_PATH: './actions-tool/package-channel.sh'
  IPA_ENTITLEMENTS_SCRIPT_PATH: './actions-tool/ipa-entitlements.sh'
  BUILDS_PATH: '/tmp/action-builds'
  PAYLOAD_PATH: '/tmp/action-builds/Payload'
  # The notes come from ReleaseNotes/<version>.md, never the PR description (ReleaseNotes/README.md).
  RELEASE_NOTES_TOOL_PATH: './actions-tool/release_notes.py'
  RELEASE_NOTES_DIR: './ReleaseNotes'
  GITHUB_RELEASE_BODY_PATH: '/tmp/action-builds/release-body.md'
  THIN_PAYLOAD_SCRIPT_PATH: './actions-tool/thin-payload.sh'
  ARCHIVE_PATH: '/tmp/action-builds/EhPanda.xcarchive'
  # One build, one copy per channel, each stamped with its channel (actions-tool/package-channel.sh).
  GITHUB_IPA_PATH: '/tmp/action-builds/EhPanda-GitHub.ipa'
  ALTSTORE_IPA_PATH: '/tmp/action-builds/EhPanda-AltStore.ipa'
  SIDESTORE_IPA_PATH: '/tmp/action-builds/EhPanda-SideStore.ipa'

jobs:
  # Snapshot gate off for 3.0 (owner decision); restore by re-adding the snapshot-gate job and the require step
  # (see git history of this commit).
  Deploy:
    runs-on: xcode-27
    timeout-minutes: 120
    # One release at a time: a second start would publish its release and then fail the push of the
    # catalogue commit. Queue, never cancel.
    concurrency:
      group: deploy-release
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch'
    # contents: the release, its tag and the push of the sources.
    permissions:
      contents: write
    steps:
      # The release is main's HEAD: its tag, sources and catalogue commit all belong to main.
      - name: Refuse to run off main
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "::error::Deploy runs on the main branch only, not on a tag."
            exit 1
          fi
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Deploy runs on main only. Merge the release pull request, then start Deploy on main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        # Main's rule only lets deploy keys past (GitHub refuses GitHub Actions on that list), so check out with
        # the repository's deploy key: the push of the AltStore and SideStore sources below then goes through.
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      # Snapshot gate off for 3.0 (owner decision); restore by re-adding the snapshot-gate job and the require step
      # (see git history of this commit).
      - name: Modify git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check build number
        run: |
          set -euo pipefail
          # The sources as published on main: AltStore and SideStore compare against those. A beta's
          # build counts too, because the beta source lists it. AltStorePAL.json is left out; the PAL
          # build has its own check in the AltStorePAL job below.
          published_path="$RUNNER_TEMP/published"
          mkdir -p "$published_path"
          git fetch --no-tags --depth 1 origin main
          for source in "$ALTSTORE_JSON_PATH" "$SIDESTORE_JSON_PATH" "$ALTSTORE_BETA_JSON_PATH"; do
            if git cat-file -e "FETCH_HEAD:${source#./}" 2>/dev/null; then
              git show "FETCH_HEAD:${source#./}" > "$published_path/$(basename "$source")"
            fi
          done
          # Every app and extension target carries the same build number; test targets carry 1.
          build_version="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+;' EhPanda.xcodeproj/project.pbxproj | grep -Eo '[0-9]+' | sort -n | tail -1)"
          bash "$CHECK_BUILD_NUMBER_SCRIPT_PATH" "$build_version" "$published_path"/*.json
      - name: Check release notes
        run: python3 "$RELEASE_NOTES_TOOL_PATH" check
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Xcode archive
        env:
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          TELEMETRYDECK_SALT: ${{ secrets.TELEMETRYDECK_SALT }}
        run: xcodebuild archive
          -skipMacroValidation
          -skipPackagePluginValidation
          -scheme ${{ env.SCHEME_NAME }}
          -destination 'generic/platform=iOS'
          -archivePath ${{ env.ARCHIVE_PATH }}
          CODE_SIGN_IDENTITY=
          CODE_SIGN_ENTITLEMENTS=
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O
          TELEMETRYDECK_APP_ID="$TELEMETRYDECK_APP_ID"
          TELEMETRYDECK_SALT="$TELEMETRYDECK_SALT"
      - name: Verify analytics credentials
        run: |
          app_info_plist="$ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app/Info.plist"
          app_id="$(plutil -extract TelemetryDeckAppID raw -o - "$app_info_plist")"
          salt="$(plutil -extract TelemetryDeckSalt raw -o - "$app_info_plist")"
          [[ ! -z "$app_id" ]] || exit 1
          [[ ! -z "$salt" ]] || exit 1
      - name: Export .ipa files
        run: |
          set -euo pipefail
          mkdir -p ${{ env.PAYLOAD_PATH }}
          mv ${{ env.ARCHIVE_PATH }}/Products/Applications/${{ env.SCHEME_NAME }}.app ${{ env.PAYLOAD_PATH }}/${{ env.SCHEME_NAME }}.app
          sh ${{ env.THIN_PAYLOAD_SCRIPT_PATH }} ${{ env.PAYLOAD_PATH }}/${{ env.SCHEME_NAME }}.app
          app_path="$PAYLOAD_PATH/$SCHEME_NAME.app"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" github "$GITHUB_IPA_PATH"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" altstore "$ALTSTORE_IPA_PATH"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" sidestore "$SIDESTORE_IPA_PATH"
      - name: Retrieve data
        id: retrieve-data
        run: |
          set -euo pipefail
          app_info_plist="$PAYLOAD_PATH/$SCHEME_NAME.app/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$app_info_plist")"
          min_os_version="$(plutil -extract MinimumOSVersion raw -o - "$app_info_plist")"
          notes_path="$RELEASE_NOTES_DIR/$version.md"
          python3 "$RELEASE_NOTES_TOOL_PATH" check "$notes_path"
          python3 "$RELEASE_NOTES_TOOL_PATH" github "$notes_path" > "$GITHUB_RELEASE_BODY_PATH"
          title="$(python3 "$RELEASE_NOTES_TOOL_PATH" title "$notes_path")"
          privacy="$(
            find "$PAYLOAD_PATH/$SCHEME_NAME.app" -name Info.plist -print0 |
            while IFS= read -r -d '' plist; do
              plutil -convert json -o - "$plist" |
                jq 'to_entries[] | select(.key | endswith("UsageDescription")) | {key: .key, value: (.value | tostring)}'
            done |
            jq -s -c 'from_entries'
          )"

          [[ ! -z "$version" ]] || exit 1
          [[ ! -z "$build_version" ]] || exit 1
          [[ ! -z "$min_os_version" ]] || exit 1
          [[ ! -z "$privacy" ]] || exit 1

          {
            echo "version=$version"
            echo "build_version=$build_version"
            echo "marketing_version=$version"
            echo "min_os_version=$min_os_version"
            echo "version_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "privacy=$privacy"
            echo "notes_path=$notes_path"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Validate data
        env:
          RELEASE_TITLE: ${{ steps.retrieve-data.outputs.title }}
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_VERSION: ${{ steps.retrieve-data.outputs.version }}
          RELEASE_BUILD_VERSION: ${{ steps.retrieve-data.outputs.build_version }}
          RELEASE_MARKETING_VERSION: ${{ steps.retrieve-data.outputs.marketing_version }}
          RELEASE_MIN_OS_VERSION: ${{ steps.retrieve-data.outputs.min_os_version }}
          RELEASE_DATE: ${{ steps.retrieve-data.outputs.version_date }}
          RELEASE_PRIVACY: ${{ steps.retrieve-data.outputs.privacy }}
        run: |
          [[ ! -z "$RELEASE_TITLE" ]] || exit 1
          [[ -f "$RELEASE_NOTES_PATH" ]] || exit 1
          [[ -s "$GITHUB_RELEASE_BODY_PATH" ]] || exit 1
          [[ ! -z "$RELEASE_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_BUILD_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_MARKETING_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_MIN_OS_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_DATE" ]] || exit 1
          printf '%s' "$RELEASE_PRIVACY" | jq -e 'type == "object"' >/dev/null
      - name: Release to GitHub
        id: release
        uses: softprops/action-gh-release@v3
        with:
         fail_on_unmatched_files: true
         files: |
           ${{ env.GITHUB_IPA_PATH }}
           ${{ env.ALTSTORE_IPA_PATH }}
           ${{ env.SIDESTORE_IPA_PATH }}
         token: ${{ secrets.GITHUB_TOKEN }}
         body_path: ${{ env.GITHUB_RELEASE_BODY_PATH }}
         name: ${{ steps.retrieve-data.outputs.title }}
         tag_name: ${{ steps.retrieve-data.outputs.version }}
         # The version's release is published as a normal, latest release (a beta of the same version may have
         # made it a pre-release). The tag is first created on main's HEAD and
         # moved onto the source update commit by the commit step below.
         prerelease: false
         make_latest: 'true'
      - name: Update AltStore.json and SideStore.json
        env:
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          RELEASE_VERSION: ${{ steps.retrieve-data.outputs.version }}
          RELEASE_BUILD_VERSION: ${{ steps.retrieve-data.outputs.build_version }}
          RELEASE_MARKETING_VERSION: ${{ steps.retrieve-data.outputs.marketing_version }}
          RELEASE_MIN_OS_VERSION: ${{ steps.retrieve-data.outputs.min_os_version }}
          RELEASE_DATE: ${{ steps.retrieve-data.outputs.version_date }}
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_PRIVACY: ${{ steps.retrieve-data.outputs.privacy }}
        run: |
          set -euo pipefail
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$PAYLOAD_PATH/$SCHEME_NAME.app/Info.plist")"
          [[ -n "$bundle_id" ]] || exit 1
          # English is the plain field: SideStore shows only it, and AltStore when no language matches.
          # AltStore.json also gets every language, English included, in localizedDescriptions.
          notes="$(python3 "$RELEASE_NOTES_TOOL_PATH" english "$RELEASE_NOTES_PATH")"
          localized_notes="$(python3 "$RELEASE_NOTES_TOOL_PATH" altstore "$RELEASE_NOTES_PATH")"
          # AltStore refuses an install whose IPA asks for a permission the source does not list. So the sources
          # get what the IPA really carries: the usage descriptions (RELEASE_PRIVACY) and the entitlements.
          entitlements="$(bash "$IPA_ENTITLEMENTS_SCRIPT_PATH" "$PAYLOAD_PATH/$SCHEME_NAME.app")"
          printf '%s' "$entitlements" | jq -e 'type == "array"' >/dev/null

          # Adds this release to a source, pointing at one channel's IPA with that file's own size and
          # checksum: SideStore and AltStore check both against the download. The fourth argument is the
          # localizedDescriptions object, or null for English only.
          add_version() {
            local source_json="$1" output_json="$2" ipa_path="$3" localized="$4"
            local ipa_name download_url size sha256 tmp
            ipa_name="$(basename "$ipa_path")"
            download_url="$(printf '%s' "$RELEASE_ASSETS" | jq -r --arg name "$ipa_name" '[.[] | select(.name == $name) | .browser_download_url][0] // empty')"
            size="$(stat -f%z "$ipa_path")"
            sha256="$(shasum -a 256 "$ipa_path" | awk '{ print $1 }')"
            [[ -n "$download_url" ]] || { echo "::error::The release has no $ipa_name."; exit 1; }
            [[ -n "$size" ]] || exit 1
            [[ -n "$sha256" ]] || exit 1
            curl -sSfIL -o /dev/null "$download_url"

            tmp="$(mktemp)"
            jq \
              --arg bundleIdentifier "$bundle_id" \
              --arg version "$RELEASE_VERSION" \
              --arg buildVersion "$RELEASE_BUILD_VERSION" \
              --arg marketingVersion "$RELEASE_MARKETING_VERSION" \
              --arg date "$RELEASE_DATE" \
              --arg localizedDescription "$notes" \
              --argjson localizedDescriptions "$localized" \
              --arg downloadURL "$download_url" \
              --arg sha256 "$sha256" \
              --arg minOSVersion "$RELEASE_MIN_OS_VERSION" \
              --argjson size "$size" \
              --argjson privacy "$RELEASE_PRIVACY" \
              --argjson entitlements "$entitlements" \
              --argjson releaseVersions null \
              -f "$SOURCE_FILTER_PATH" "$source_json" > "$tmp"
            jq -e '(.apps[0].versions | length) >= 1' "$tmp" >/dev/null
            mv "$tmp" "$output_json"
          }

          add_version "$ALTSTORE_JSON_PATH" "$ALTSTORE_JSON_PATH" "$ALTSTORE_IPA_PATH" "$localized_notes"
          # The first release creates SideStore.json. The template has no versions, and SideStore rejects
          # a source with none, so it is only ever written with this release added.
          sidestore_source="$SIDESTORE_JSON_PATH"
          if [[ ! -f "$sidestore_source" ]]; then
            sidestore_source="$SIDESTORE_TEMPLATE_PATH"
          fi
          add_version "$sidestore_source" "$SIDESTORE_JSON_PATH" "$SIDESTORE_IPA_PATH" null
      - name: Commit update AltStore.json and SideStore.json
        env:
          RELEASE_VERSION: ${{ steps.retrieve-data.outputs.version }}
        run: |
          set -euo pipefail
          git add "$ALTSTORE_JSON_PATH" "$SIDESTORE_JSON_PATH"
          git commit -m "Update AltStore.json and SideStore.json"
          git push origin HEAD
          # The release's tag was created on main's HEAD before this commit; it belongs on the source update commit.
          git tag -f "$RELEASE_VERSION" HEAD
          git push -f origin "refs/tags/$RELEASE_VERSION"
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_VERSION" | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_tag" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The tag $RELEASE_VERSION is on ${remote_tag:-no commit}, not on the source update commit $(git rev-parse HEAD)."
            exit 1
          fi
      - name: Post release notes
        env:
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          # Telegram: English, then 繁體中文, then the link, as plain text. Discord: English, then the link.
          telegram_text="$BUILDS_PATH/telegram.txt"
          python3 "$RELEASE_NOTES_TOOL_PATH" telegram "$RELEASE_NOTES_PATH" "$RELEASE_URL" > "$telegram_text"
          curl -sS --fail-with-body "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHANNEL_ID" \
            --data-urlencode "text@$telegram_text"

          discord_payload="$BUILDS_PATH/discord.json"
          python3 "$RELEASE_NOTES_TOOL_PATH" discord "$RELEASE_NOTES_PATH" "$RELEASE_URL" | jq -Rs '{content: .}' > "$discord_payload"
          # wait=true makes Discord answer with the posted message, whose id a later post can edit. The webhook
          # URL is a secret and is never printed.
          discord_url="$DISCORD_WEBHOOK"
          if [[ "$discord_url" == *\?* ]]; then
            discord_url="$discord_url&wait=true"
          else
            discord_url="$discord_url?wait=true"
          fi
          discord_message="$(curl -sS --fail-with-body "$discord_url" \
            -H 'Content-Type: application/json' \
            --data-binary "@$discord_payload")"
          discord_id="$(printf '%s' "$discord_message" | jq -r .id)"
          echo "Discord message id: $discord_id"

  # The AltStore PAL build (DIST-18-03), after the release and from the same commit. Upload only (owner decision,
  # 2026-11-21); the header lists its environment and secrets.
  AltStorePAL:
    needs: Deploy
    runs-on: xcode-27
    environment: pal-notarization
    timeout-minutes: 120
    # One upload at a time: queue, never cancel.
    concurrency:
      group: pal-upload
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ASC_APP_ID: ${{ vars.ALTSTORE_PAL_MARKETPLACE_ID }}
      APP_STORE_CONNECT_KEY_ROLE: ${{ vars.APP_STORE_CONNECT_KEY_ROLE }}
      ALTSTORE_PAL_JSON_PATH: './AltStorePAL.json'
      ASC_TOOL_PATH: './actions-tool/asc.py'
      SIGNING_SCRIPT_PATH: './actions-tool/marketplace-signing.sh'
      # The marketplace flavor (Config/Marketplace.xcconfig, included by the generated signing xcconfig).
      MARKETPLACE_BUNDLE_ID: 'app.ehpanda.store'
      MARKETPLACE_URL_SCHEME: 'ehpanda-marketplace'
      # Its own archive: the Classic archive is never reused or re-signed (owner decision).
      PAL_ARCHIVE_PATH: '/tmp/action-builds/EhPanda-AltStorePAL.xcarchive'
      PAL_EXPORT_PATH: '/tmp/action-builds/EhPanda-AltStorePAL-export'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Snapshot gate off for 3.0 (owner decision); restore by re-adding the snapshot-gate job and the require step
      # (see git history of this commit).
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::The ALTSTORE_PAL_MARKETPLACE_ID variable is not set to the app's Apple ID."; exit 1; }
          # The release's version, read from the project as Deploy's build gets it: every app and extension
          # target carries the same MARKETING_VERSION; test targets carry 1.0.
          versions="$(grep -Eo 'MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;' EhPanda.xcodeproj/project.pbxproj | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)"
          [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The project's targets do not share one MARKETING_VERSION: '$(tr '\n' ' ' <<< "$versions")'."; exit 1; }
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "The project is version $versions."
      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash "$SIGNING_SCRIPT_PATH" api-key
          # D-21: every App Store Connect call of this run is appended here and uploaded at the end.
          echo "ASC_CALL_RECORD=$RUNNER_TEMP/asc-calls.jsonl" >> "$GITHUB_ENV"
      - name: Check build number
        id: build-number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The PAL source as published on main. The Classic sources are not compared: the PAL build carries the
          # Classic release's build number (D-26).
          published_path="$RUNNER_TEMP/published"
          mkdir -p "$published_path"
          git fetch --no-tags --depth 1 origin main
          if git cat-file -e "FETCH_HEAD:${ALTSTORE_PAL_JSON_PATH#./}" 2>/dev/null; then
            git show "FETCH_HEAD:${ALTSTORE_PAL_JSON_PATH#./}" > "$published_path/$(basename "$ALTSTORE_PAL_JSON_PATH")"
          fi
          # Every app and extension target carries the same build number; test targets carry 1.
          build_version="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+;' EhPanda.xcodeproj/project.pbxproj | grep -Eo '[0-9]+' | sort -n | tail -1)"
          bash "$CHECK_BUILD_NUMBER_SCRIPT_PATH" "$build_version" "$published_path"/*.json
          # Build numbers are single-use in App Store Connect, uploaded or not (Research pitfall 2).
          python3 "$ASC_TOOL_PATH" check-build --app "$ASC_APP_ID" --version "$VERSION" --build "$build_version"
          echo "build=$build_version" >> "$GITHUB_OUTPUT"
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PROVISIONING_PROFILE_SHARE_EXTENSION: ${{ secrets.PROVISIONING_PROFILE_SHARE_EXTENSION }}
        run: bash "$SIGNING_SCRIPT_PATH" setup
      - name: Xcode archive
        env:
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          TELEMETRYDECK_SALT: ${{ secrets.TELEMETRYDECK_SALT }}
        run: |
          set -euo pipefail
          # The generated xcconfig includes Config/Marketplace.xcconfig and selects each target's profile. The
          # channel stamp is a build setting there: a signed build is never stamped afterwards.
          xcodebuild archive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PAL_ARCHIVE_PATH" \
            -xcconfig "$MARKETPLACE_XCCONFIG" \
            OTHER_CODE_SIGN_FLAGS="--keychain $MARKETPLACE_KEYCHAIN" \
            GCC_OPTIMIZATION_LEVEL=s \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            TELEMETRYDECK_APP_ID="$TELEMETRYDECK_APP_ID" \
            TELEMETRYDECK_SALT="$TELEMETRYDECK_SALT"
      - name: Verify analytics credentials
        run: |
          app_info_plist="$PAL_ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app/Info.plist"
          app_id="$(plutil -extract TelemetryDeckAppID raw -o - "$app_info_plist")"
          salt="$(plutil -extract TelemetryDeckSalt raw -o - "$app_info_plist")"
          [[ ! -z "$app_id" ]] || exit 1
          [[ ! -z "$salt" ]] || exit 1
      - name: Verify marketplace build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$PAL_ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app"
          extension_path="$app_path/PlugIns/ShareExtension.appex"
          app_info_plist="$app_path/Info.plist"
          extension_info_plist="$extension_path/Info.plist"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app_info_plist")"
          extension_bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$extension_info_plist")"
          display_name="$(plutil -extract CFBundleDisplayName raw -o - "$app_info_plist")"
          url_scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$app_info_plist")"
          extension_url_scheme="$(plutil -extract EhPandaURLScheme raw -o - "$extension_info_plist")"
          channel="$(plutil -extract EhPandaDistributionChannel raw -o - "$app_info_plist")"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$app_info_plist")"

          [[ "$bundle_id" == "$MARKETPLACE_BUNDLE_ID" ]] || { echo "::error::The app is $bundle_id, not $MARKETPLACE_BUNDLE_ID."; exit 1; }
          [[ "$extension_bundle_id" == "$MARKETPLACE_BUNDLE_ID.ShareExtension" ]] || { echo "::error::The share extension is $extension_bundle_id."; exit 1; }
          [[ "$display_name" == "EhPanda" ]] || { echo "::error::The marketplace build is named '$display_name', not 'EhPanda'."; exit 1; }
          [[ "$url_scheme" == "$MARKETPLACE_URL_SCHEME" ]] || { echo "::error::The marketplace build registers '$url_scheme', not $MARKETPLACE_URL_SCHEME."; exit 1; }
          [[ "$extension_url_scheme" == "$url_scheme" ]] || { echo "::error::The share extension hands off to $extension_url_scheme, not $url_scheme."; exit 1; }
          [[ "$channel" == "altstorePAL" ]] || { echo "::error::The build is stamped '$channel', not altstorePAL."; exit 1; }
          [[ "$version" == "$VERSION" ]] || { echo "::error::The build is version $version, not $VERSION."; exit 1; }
          [[ "$build_version" == "$BUILD_NUMBER" ]] || { echo "::error::The build is number $build_version, not $BUILD_NUMBER."; exit 1; }
          [[ -f "$app_path/PrivacyInfo.xcprivacy" ]] || { echo "::error::The app has no PrivacyInfo.xcprivacy."; exit 1; }

          codesign --verify --deep --strict "$app_path"
          for bundle in "$app_path" "$extension_path"; do
            details="$(codesign -dvv "$bundle" 2>&1)"
            grep -q '^Authority=Apple Distribution: ' <<< "$details" || { echo "::error::$(basename "$bundle") is not signed by an Apple Distribution certificate."; exit 1; }
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details" || { echo "::error::$(basename "$bundle") is not signed by APPLE_TEAM_ID."; exit 1; }
            [[ -f "$bundle/embedded.mobileprovision" ]] || { echo "::error::$(basename "$bundle") has no provisioning profile."; exit 1; }
            entitlements="$RUNNER_TEMP/entitlements.plist"
            codesign -d --entitlements - --xml "$bundle" > "$entitlements" 2>/dev/null
            if [[ "$(plutil -extract get-task-allow raw -o - "$entitlements" 2>/dev/null || echo false)" != "false" ]]; then
              echo "::error::$(basename "$bundle") is signed for debugging (get-task-allow)."
              exit 1
            fi
          done
          bash "$CHECK_BUILD_NUMBER_SCRIPT_PATH" "$build_version" "$RUNNER_TEMP/published"/*.json
      - name: Export and upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.build }}
        run: |
          set -euo pipefail
          # destination upload: xcodebuild signs the export with the profiles named in the export options and
          # sends it to App Store Connect with the API key.
          xcodebuild -exportArchive \
            -archivePath "$PAL_ARCHIVE_PATH" \
            -exportOptionsPlist "$MARKETPLACE_EXPORT_OPTIONS" \
            -exportPath "$PAL_EXPORT_PATH" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          # Upload only (owner decision, 2026-11-21): the version, the build's attachment and the submission are
          # the collaborator's steps in App Store Connect.
          {
            echo "### AltStore PAL $VERSION ($BUILD_NUMBER) uploaded"
            echo ""
            echo "The collaborator now creates version $VERSION in App Store Connect with review type Notarization, adds this build and submits it. Once Apple accepts it, run Publish AltStore PAL with the ADP ID."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the call record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asc-call-record-${{ steps.version.outputs.version }}-upload
          path: ${{ runner.temp }}/asc-calls.jsonl
          if-no-files-found: ignore
      - name: Tear down signing
        if: always()
        run: bash "$SIGNING_SCRIPT_PATH" teardown
