name: Deploy
on:
  pull_request:
    branches:
      - main
    types: [closed]
env:
  SCHEME_NAME: 'EhPanda'
  ALTSTORE_JSON_PATH: './AltStore.json'
  SIDESTORE_JSON_PATH: './SideStore.json'
  SIDESTORE_TEMPLATE_PATH: './actions-tool/sidestore.template.json'
  SOURCE_FILTER_PATH: './actions-tool/altstore-add-version.jq'
  PACKAGE_CHANNEL_SCRIPT_PATH: './actions-tool/package-channel.sh'
  BUILDS_PATH: '/tmp/action-builds'
  PAYLOAD_PATH: '/tmp/action-builds/Payload'
  # The notes come from ReleaseNotes/<version>.md, never the PR description (ReleaseNotes/README.md).
  RELEASE_NOTES_TOOL_PATH: './actions-tool/release_notes.py'
  RELEASE_NOTES_DIR: './ReleaseNotes'
  GITHUB_RELEASE_BODY_PATH: '/tmp/action-builds/release-body.md'
  THIN_PAYLOAD_SCRIPT_PATH: './actions-tool/thin-payload.sh'
  ARCHIVE_PATH: '/tmp/action-builds/EhPanda.xcarchive'
  # One build, one copy per channel, each stamped with its channel (actions-tool/package-channel.sh).
  GITHUB_IPA_PATH: '/tmp/action-builds/EhPanda-GitHub.ipa'
  ALTSTORE_IPA_PATH: '/tmp/action-builds/EhPanda-AltStore.ipa'
  SIDESTORE_IPA_PATH: '/tmp/action-builds/EhPanda-SideStore.ipa'

jobs:
  # No release builds without a green full screenshot matrix in compare mode (19-10; D-16).
  snapshot-gate:
    if: |
      github.event.pull_request.merged == true && github.event.pull_request.user.login == 'chihchy'
    permissions:
      contents: read
    uses: ./.github/workflows/snapshot-gate.yml
    with:
      mode: compare
  Deploy:
    needs: snapshot-gate
    runs-on: xcode-27
    timeout-minutes: 120
    # One release at a time: the gate lets two merged release pull requests reach this job together, and the
    # second would publish its release and then fail the push of the catalogue commit. Queue, never cancel.
    # On the job, not the workflow: a pull request closed without merging also starts this workflow, and
    # would take the queue's one pending place from a real release.
    concurrency:
      group: deploy-release
      cancel-in-progress: false
    if: |
      github.event.pull_request.merged == true && github.event.pull_request.user.login == 'chihchy'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Modify git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check release notes
        run: python3 "$RELEASE_NOTES_TOOL_PATH" check
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run tests
        run: xcodebuild clean test
          -skipMacroValidation
          -skipPackagePluginValidation
          -scheme ${{ env.SCHEME_NAME }}
          -testPlan FeatureTests
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=27.0'
      - name: Xcode archive
        env:
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          TELEMETRYDECK_SALT: ${{ secrets.TELEMETRYDECK_SALT }}
        run: xcodebuild archive
          -skipMacroValidation
          -skipPackagePluginValidation
          -scheme ${{ env.SCHEME_NAME }}
          -destination 'generic/platform=iOS'
          -archivePath ${{ env.ARCHIVE_PATH }}
          CODE_SIGN_IDENTITY=
          CODE_SIGN_ENTITLEMENTS=
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          GCC_OPTIMIZATION_LEVEL=s
          SWIFT_OPTIMIZATION_LEVEL=-O
          TELEMETRYDECK_APP_ID="$TELEMETRYDECK_APP_ID"
          TELEMETRYDECK_SALT="$TELEMETRYDECK_SALT"
      - name: Verify analytics credentials
        run: |
          app_info_plist="$ARCHIVE_PATH/Products/Applications/$SCHEME_NAME.app/Info.plist"
          app_id="$(plutil -extract TelemetryDeckAppID raw -o - "$app_info_plist")"
          salt="$(plutil -extract TelemetryDeckSalt raw -o - "$app_info_plist")"
          [[ ! -z "$app_id" ]] || exit 1
          [[ ! -z "$salt" ]] || exit 1
      - name: Export .ipa files
        run: |
          set -euo pipefail
          mkdir -p ${{ env.PAYLOAD_PATH }}
          mv ${{ env.ARCHIVE_PATH }}/Products/Applications/${{ env.SCHEME_NAME }}.app ${{ env.PAYLOAD_PATH }}/${{ env.SCHEME_NAME }}.app
          sh ${{ env.THIN_PAYLOAD_SCRIPT_PATH }} ${{ env.PAYLOAD_PATH }}/${{ env.SCHEME_NAME }}.app
          app_path="$PAYLOAD_PATH/$SCHEME_NAME.app"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" github "$GITHUB_IPA_PATH"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" altstore "$ALTSTORE_IPA_PATH"
          bash "$PACKAGE_CHANNEL_SCRIPT_PATH" "$app_path" sidestore "$SIDESTORE_IPA_PATH"
      - name: Retrieve data
        id: retrieve-data
        run: |
          set -euo pipefail
          app_info_plist="$PAYLOAD_PATH/$SCHEME_NAME.app/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$app_info_plist")"
          min_os_version="$(plutil -extract MinimumOSVersion raw -o - "$app_info_plist")"
          notes_path="$RELEASE_NOTES_DIR/$version.md"
          python3 "$RELEASE_NOTES_TOOL_PATH" check "$notes_path"
          python3 "$RELEASE_NOTES_TOOL_PATH" github "$notes_path" > "$GITHUB_RELEASE_BODY_PATH"
          privacy="$(
            find "$PAYLOAD_PATH/$SCHEME_NAME.app" -name Info.plist -print0 |
            while IFS= read -r -d '' plist; do
              plutil -convert json -o - "$plist" |
                jq 'to_entries[] | select(.key | endswith("UsageDescription")) | {key: .key, value: (.value | tostring)}'
            done |
            jq -s -c 'from_entries'
          )"

          [[ ! -z "$version" ]] || exit 1
          [[ ! -z "$build_version" ]] || exit 1
          [[ ! -z "$min_os_version" ]] || exit 1
          [[ ! -z "$privacy" ]] || exit 1

          {
            echo "version=$version"
            echo "build_version=$build_version"
            echo "marketing_version=$version"
            echo "min_os_version=$min_os_version"
            echo "version_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "privacy=$privacy"
            echo "notes_path=$notes_path"
          } >> "$GITHUB_OUTPUT"
      - name: Validate data
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_VERSION: ${{ steps.retrieve-data.outputs.version }}
          RELEASE_BUILD_VERSION: ${{ steps.retrieve-data.outputs.build_version }}
          RELEASE_MARKETING_VERSION: ${{ steps.retrieve-data.outputs.marketing_version }}
          RELEASE_MIN_OS_VERSION: ${{ steps.retrieve-data.outputs.min_os_version }}
          RELEASE_DATE: ${{ steps.retrieve-data.outputs.version_date }}
          RELEASE_PRIVACY: ${{ steps.retrieve-data.outputs.privacy }}
        run: |
          [[ ! -z "$PR_TITLE" ]] || exit 1
          [[ -f "$RELEASE_NOTES_PATH" ]] || exit 1
          [[ -s "$GITHUB_RELEASE_BODY_PATH" ]] || exit 1
          [[ ! -z "$RELEASE_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_BUILD_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_MARKETING_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_MIN_OS_VERSION" ]] || exit 1
          [[ ! -z "$RELEASE_DATE" ]] || exit 1
          printf '%s' "$RELEASE_PRIVACY" | jq -e 'type == "object"' >/dev/null
      - name: Release to GitHub
        id: release
        uses: softprops/action-gh-release@v3
        with:
         fail_on_unmatched_files: true
         files: |
           ${{ env.GITHUB_IPA_PATH }}
           ${{ env.ALTSTORE_IPA_PATH }}
           ${{ env.SIDESTORE_IPA_PATH }}
         token: ${{ secrets.GITHUB_TOKEN }}
         body_path: ${{ env.GITHUB_RELEASE_BODY_PATH }}
         name: ${{ github.event.pull_request.title }}
         tag_name: ${{ steps.retrieve-data.outputs.version }}
      - name: Update AltStore.json and SideStore.json
        env:
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          RELEASE_VERSION: ${{ steps.retrieve-data.outputs.version }}
          RELEASE_BUILD_VERSION: ${{ steps.retrieve-data.outputs.build_version }}
          RELEASE_MARKETING_VERSION: ${{ steps.retrieve-data.outputs.marketing_version }}
          RELEASE_MIN_OS_VERSION: ${{ steps.retrieve-data.outputs.min_os_version }}
          RELEASE_DATE: ${{ steps.retrieve-data.outputs.version_date }}
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_PRIVACY: ${{ steps.retrieve-data.outputs.privacy }}
        run: |
          set -euo pipefail
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$PAYLOAD_PATH/$SCHEME_NAME.app/Info.plist")"
          [[ -n "$bundle_id" ]] || exit 1
          # English is the plain field: SideStore shows only it, and AltStore when no language matches.
          # AltStore.json also gets every language, English included, in localizedDescriptions.
          notes="$(python3 "$RELEASE_NOTES_TOOL_PATH" english "$RELEASE_NOTES_PATH")"
          localized_notes="$(python3 "$RELEASE_NOTES_TOOL_PATH" altstore "$RELEASE_NOTES_PATH")"

          # Adds this release to a source, pointing at one channel's IPA with that file's own size and
          # checksum: SideStore and AltStore check both against the download. The fourth argument is the
          # localizedDescriptions object, or null for English only.
          add_version() {
            local source_json="$1" output_json="$2" ipa_path="$3" localized="$4"
            local ipa_name download_url size sha256 tmp
            ipa_name="$(basename "$ipa_path")"
            download_url="$(printf '%s' "$RELEASE_ASSETS" | jq -r --arg name "$ipa_name" '[.[] | select(.name == $name) | .browser_download_url][0] // empty')"
            size="$(stat -f%z "$ipa_path")"
            sha256="$(shasum -a 256 "$ipa_path" | awk '{ print $1 }')"
            [[ -n "$download_url" ]] || { echo "::error::The release has no $ipa_name."; exit 1; }
            [[ -n "$size" ]] || exit 1
            [[ -n "$sha256" ]] || exit 1
            curl -sSfIL -o /dev/null "$download_url"

            tmp="$(mktemp)"
            jq \
              --arg bundleIdentifier "$bundle_id" \
              --arg version "$RELEASE_VERSION" \
              --arg buildVersion "$RELEASE_BUILD_VERSION" \
              --arg marketingVersion "$RELEASE_MARKETING_VERSION" \
              --arg date "$RELEASE_DATE" \
              --arg localizedDescription "$notes" \
              --argjson localizedDescriptions "$localized" \
              --arg downloadURL "$download_url" \
              --arg sha256 "$sha256" \
              --arg minOSVersion "$RELEASE_MIN_OS_VERSION" \
              --argjson size "$size" \
              --argjson privacy "$RELEASE_PRIVACY" \
              --argjson releaseVersions null \
              -f "$SOURCE_FILTER_PATH" "$source_json" > "$tmp"
            jq -e '(.apps[0].versions | length) >= 1' "$tmp" >/dev/null
            mv "$tmp" "$output_json"
          }

          add_version "$ALTSTORE_JSON_PATH" "$ALTSTORE_JSON_PATH" "$ALTSTORE_IPA_PATH" "$localized_notes"
          # The first release creates SideStore.json. The template has no versions, and SideStore rejects
          # a source with none, so it is only ever written with this release added.
          sidestore_source="$SIDESTORE_JSON_PATH"
          if [[ ! -f "$sidestore_source" ]]; then
            sidestore_source="$SIDESTORE_TEMPLATE_PATH"
          fi
          add_version "$sidestore_source" "$SIDESTORE_JSON_PATH" "$SIDESTORE_IPA_PATH" null
      - name: Commit update AltStore.json and SideStore.json
        run: |
          git add "$ALTSTORE_JSON_PATH" "$SIDESTORE_JSON_PATH"
          git commit -m "Update AltStore.json and SideStore.json"
          git push origin HEAD
      - name: Post release notes
        env:
          RELEASE_NOTES_PATH: ${{ steps.retrieve-data.outputs.notes_path }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          # Telegram: English, then 繁體中文, then the link, as plain text. Discord: English, then the link.
          telegram_text="$BUILDS_PATH/telegram.txt"
          python3 "$RELEASE_NOTES_TOOL_PATH" telegram "$RELEASE_NOTES_PATH" "$RELEASE_URL" > "$telegram_text"
          curl -sS --fail-with-body "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHANNEL_ID" \
            --data-urlencode "text@$telegram_text"

          discord_payload="$BUILDS_PATH/discord.json"
          python3 "$RELEASE_NOTES_TOOL_PATH" discord "$RELEASE_NOTES_PATH" "$RELEASE_URL" | jq -Rs '{content: .}' > "$discord_payload"
          curl -sS --fail-with-body "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data-binary "@$discord_payload"
