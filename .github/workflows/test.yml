name: Test
on: [push, workflow_dispatch]
env:
   SCHEME_NAME: 'EhPanda'
jobs:
  Test:
    runs-on: xcode-27
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install iOS 27 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run tests
        run: xcodebuild clean test
          -skipMacroValidation
          -skipPackagePluginValidation
          -scheme ${{ env.SCHEME_NAME }}
          -testPlan FeatureTests
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=27.0'
          -onlyUsePackageVersionsFromResolvedFile
          -resultBundlePath '${{ runner.temp }}/FeatureTests.xcresult'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-test-results
          path: ${{ runner.temp }}/FeatureTests.xcresult
          if-no-files-found: ignore
