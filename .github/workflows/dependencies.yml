name: Xcode Dependencies
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  dependencies:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Update package dependencies and both lockfiles
        id: resolution
        run: |
          set -euo pipefail
          xcrun swift package --package-path AppPackage update
          cp AppPackage/Package.resolved EhPanda.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -project EhPanda.xcodeproj -scheme EhPanda \
            -onlyUsePackageVersionsFromResolvedFile
          if git diff --quiet -- AppPackage/Package.resolved \
            EhPanda.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo 'dependenciesChanged=false' >> "$GITHUB_OUTPUT"
          else
            echo 'dependenciesChanged=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        if: steps.resolution.outputs.dependenciesChanged == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: 'update-dependencies'
          delete-branch: true
          commit-message: 'Update dependencies [skip test]'
          title: 'Updated Dependencies'
