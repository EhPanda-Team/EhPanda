name: Xcode Dependencies
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  # To start the screenshot check on the update branch (below).
  actions: write
jobs:
  dependencies:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          # The job runs package manifests; the pull-request step below authenticates with its own token input.
          persist-credentials: false
      - name: Update package dependencies and both lockfiles
        id: resolution
        run: |
          set -euo pipefail
          xcrun swift package --package-path AppPackage update
          cp AppPackage/Package.resolved EhPanda.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -project EhPanda.xcodeproj -scheme EhPanda \
            -onlyUsePackageVersionsFromResolvedFile
          if git diff --quiet -- AppPackage/Package.resolved \
            EhPanda.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo 'dependenciesChanged=false' >> "$GITHUB_OUTPUT"
          else
            echo 'dependenciesChanged=true' >> "$GITHUB_OUTPUT"
          fi
      # The pull request's body: which pins changed, which packages came and went, and where each changed
      # package's release notes are (actions-tool/dependency_changes.py). It names the Xcode that resolved them,
      # since another toolchain can resolve the same requirements to other pins. The body is written outside the
      # checkout, because the next step commits every file it finds there. That step also rewrites the body of a
      # pull request that is still open, so the body always describes the whole change from `develop`.
      - name: Describe what changed
        if: steps.resolution.outputs.dependenciesChanged == 'true'
        run: |
          set -euo pipefail
          git show HEAD:AppPackage/Package.resolved > "$RUNNER_TEMP/Package.resolved.before"
          python3 actions-tool/dependency_changes.py --xcode "$(xcodebuild -version)" \
            "$RUNNER_TEMP/Package.resolved.before" AppPackage/Package.resolved \
            | tee "$RUNNER_TEMP/dependency-changes.md"
      - name: Create Pull Request
        id: pull-request
        if: steps.resolution.outputs.dependenciesChanged == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: 'update-dependencies'
          delete-branch: true
          commit-message: 'Update dependencies [skip test]'
          title: 'Updated Dependencies'
          body-path: ${{ runner.temp }}/dependency-changes.md
      # A pull request opened with the default GITHUB_TOKEN starts no pull_request workflow; a dispatch is the
      # documented exception, so the screenshot check is started on the update branch here (19-10; D-16).
      - name: Run the screenshot check on the update branch
        if: >-
          steps.pull-request.outputs.pull-request-number != ''
          && steps.pull-request.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run snapshot-gate.yml --ref update-dependencies -f mode=compare
