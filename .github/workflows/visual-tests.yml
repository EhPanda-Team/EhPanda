name: Visual capture
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: visual-capture
  cancel-in-progress: false
jobs:
  Capture:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check visual runner contracts
        run: python3 -B -m unittest discover -s Scripts/visual -p 'test_*.py'
      - name: Validate the pinned rendering environment
        run: |
          python3 -B Scripts/visual/environment.py validate \
            --environment Scripts/visual/regression-environment.json \
            --output '${{ runner.temp }}/visual-environment' \
            --derived-data '${{ runner.temp }}/visual-derived'
      - name: Run configured native capture matrix
        env:
          CAPTURE_ROOT: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ['CAPTURE_ROOT'])
          observation = json.loads((root / 'visual-environment/environment.json').read_text())
          destinations = observation['destinations']
          subprocess.run([
              'python3', '-B', 'Scripts/verify-full-content-capture.py',
              '--phone', destinations['iphone']['udid'],
              '--tablet', destinations['ipad']['udid'],
              '--output', str(root / 'visual-capture'),
              '--derived-data', str(root / 'visual-derived'),
          ], check=True)
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-capture-evidence
          path: |
            ${{ runner.temp }}/visual-environment
            ${{ runner.temp }}/visual-capture
          if-no-files-found: ignore
