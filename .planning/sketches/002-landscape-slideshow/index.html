<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home · Landscape Slideshow</title><link rel="stylesheet" href="../themes/default.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e6e8ec;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:hover{filter:brightness(.93)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{transform:translateY(1px)}.review{position:sticky;top:0;z-index:10;background:#202523;color:white;display:flex;gap:20px;align-items:center;padding:14px 24px;flex-wrap:wrap}.brand{font-size:13px;line-height:1.5}.brand b{display:block;font-size:15px}.variants{display:flex;gap:6px;flex:1}.variants button{padding:10px 13px;color:#ddd;border-radius:8px;font-size:13px}.variants button[aria-pressed=true]{background:#f3f6ee;color:#294714;font-weight:650}select{background:#343b37;color:white;border:1px solid #536156;border-radius:7px;padding:8px;font-size:12px}.note{max-width:1194px;margin:18px auto;padding:0 20px;font-size:14px;line-height:1.65;color:#4b5550}.note strong{color:#253c22}.note small{display:block;margin-top:5px}.canvas{width:min(1194px,100%);margin:0 auto 45px;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 12px 50px #1c252515;container:home / inline-size;--scale:1}.app-header{padding:18px 28px 26px}.tabs{display:flex;width:max-content;margin:0 auto 24px;padding:5px;border:1px solid var(--line);border-radius:40px;gap:2px}.tabs span{padding:9px 21px;font-size:17px;font-weight:580}.tabs .selected{color:var(--accent);background:var(--surface);border-radius:30px}.homebar{display:flex;align-items:center;justify-content:space-between}.homebar h1{font-size:34px;margin:0}.circle{border:1px solid var(--line);width:42px;height:42px;border-radius:50%;font-size:23px}.carousel{position:relative;overflow:hidden}.track{display:flex;gap:20px;transform:translateX(calc((100cqw - var(--card-width))/2 - var(--card-width) - 20px));align-items:stretch;padding:0}.hero{flex:none;width:var(--card-width);min-height:274px;padding:26px;display:flex;gap:30px;align-items:center;text-align:left;background:var(--surface);border-radius:16px}.hero.adjacent{opacity:.82}.hero .cover{width:154px}.cover{flex:none;aspect-ratio:8/11;border-radius:8px;overflow:hidden;background:var(--surface)}.cover svg{display:block;width:100%;height:100%}.copy{flex:1;min-width:0}.title{font-size:calc(25px * var(--scale));line-height:1.25;letter-spacing:-.4px;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}.facts{min-width:0}.rating-language{display:flex;flex-wrap:wrap;gap:12px;font-size:calc(14px * var(--scale));margin-bottom:20px}.rating{white-space:nowrap;color:inherit}.language{color:var(--secondary)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:500px;margin:0}.fields div{min-width:0}.fields dt{color:var(--secondary);font-size:calc(12px * var(--scale));margin:0 0 4px}.fields dd{font-size:calc(15px * var(--scale));margin:0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.chip{font-size:calc(11px * var(--scale));border:1px solid var(--line);padding:4px 8px;border-radius:6px;background:var(--bg);color:var(--secondary)}.controls{display:flex;gap:9px;justify-content:center;align-items:center;margin:12px 0 0;color:var(--secondary)}.controls button{width:28px;height:28px;font-size:20px}.dot{width:5px;height:5px;border-radius:50%;background:var(--line)}.dot.on{width:16px;border-radius:5px;background:var(--accent)}.section{padding:0 28px;margin-top:30px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sectionhead h2{margin:0;font-size:23px}.sectionhead button{color:var(--accent);font-size:14px}.wall{display:flex;gap:24px;overflow:hidden}.wall-card{flex:0 0 145px;text-align:left;padding:0}.wall-card .cover{width:145px}.wall-title{font-size:14px;line-height:1.35;min-height:2.7em;margin:10px 0 7px;font-weight:600}.meta{font-size:12px;color:var(--secondary)}.lower{padding-bottom:32px}.ranking{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:0 30px}.rank{padding:12px 0;display:flex;gap:14px;border-bottom:1px solid var(--line);text-align:left;align-items:flex-start}.rank .cover{width:84px}.rankno{font-size:23px}.rank h3{font-size:16px;margin:0 0 6px}.rank .meta{line-height:1.7}.rank .rating{font-size:14px;margin-top:5px}.others{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.other{min-height:186px;padding:23px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;text-align:left}.other h3{font-size:23px;margin:0}.other p{color:var(--secondary);font-size:14px;line-height:1.5;flex:1}.other footer{border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--secondary);display:flex;justify-content:space-between;gap:10px}.tools{position:fixed;bottom:14px;right:14px;z-index:20;background:#202523ed;color:white;padding:9px 12px;border-radius:10px;display:flex;gap:12px;font-size:12px}.toast{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);background:#222e;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;z-index:30}.toast.visible{opacity:1}.annotations .hero,.annotations .fields,.annotations .cover{outline:1px dashed var(--accent);outline-offset:3px}.baseline,.option-a,.option-b,.option-c{--card-width:90cqw}.option-a{--card-width:min(720px,90cqw)}.option-b .hero{min-height:356px;padding:32px 40px;gap:40px}.option-b .hero .cover{width:212px}.option-b .copy{max-width:660px;margin:auto}.option-b .title{font-size:calc(30px * var(--scale))}.option-b .fields{max-width:500px}.option-c .copy{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.85fr);gap:30px;align-items:center}.option-c .facts{padding-left:30px;border-left:1px solid var(--line)}.option-c .title{margin-bottom:18px}.option-c .rating-language{margin-bottom:0}.option-c .fields{grid-template-columns:1fr 1fr}.capture .review,.capture .note,.capture .tools{display:none}.capture{background:var(--bg)}.capture .canvas{margin:0 auto;border-radius:0;box-shadow:none}.capture .lower{display:none}.capture .wall{max-height:225px}.capture .app-header{padding-top:20px}@container home (max-width:900px){.carousel{--card-width:90cqw}.option-b .hero{min-height:274px;padding:26px;gap:30px}.option-b .hero .cover{width:154px}.option-b .copy{max-width:none;margin:0}.option-b .title{font-size:calc(25px * var(--scale))}.option-c .copy{display:block}.option-c .facts{border:0;padding:0}.option-c .rating-language{margin-bottom:20px}}@container home (max-width:650px){.hero,.option-b .hero{padding:20px;gap:20px;align-items:flex-start}.hero .cover,.option-b .hero .cover{width:116px}.title,.option-b .title{font-size:calc(22px * var(--scale))}.fields{gap:12px}.tabs span{font-size:14px;padding:8px 12px}.others{display:flex;overflow:auto}.other{min-width:245px}.ranking{grid-template-columns:1fr;grid-template-rows:repeat(6,auto)}}@media(max-width:800px){.review{gap:8px}.brand{display:none}.variants{min-width:100%;flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,filter .15s}.toast{transition:opacity .15s}}
</style></head><body>
<header class="review"><div class="brand"><b>Slideshow · 橫向留白</b>三個新提案，尚未套用</div><nav class="variants" aria-label="Slideshow 提案"><button data-v="current">目前 C</button><button data-v="a">A · 縮窄卡片</button><button data-v="b">B · 放大封面</button><button data-v="c">C · 左右資訊組</button></nav><select id="size" aria-label="預覽寬度"><option value="1194">Landscape · 1194</option><option value="834">Portrait · 834</option><option value="1450">大視窗 · 1450</option><option value="600">窄視窗 · 600</option></select><select id="textsize" aria-label="預覽字級"><option value="1">一般字級</option><option value="1.4">放大文字 · 140%</option></select></header>
<div class="note" id="note"></div><main class="canvas" id="canvas"><div class="app-header"><div class="tabs" aria-label="沿用現有 app 導覽的比較框架"><span class="selected">Home</span><span>Library</span><span>Search</span><span>Setting</span></div><div class="homebar"><h1>Home</h1><button class="circle" id="refresh" aria-label="更新 Home">↶</button></div></div><div id="content"></div></main>
<div class="tools"><button id="theme">深色</button><button id="annotate" aria-pressed="false">顯示邊界</button><button id="top">回頂部</button></div><div class="toast" id="toast" role="status"></div>
<script>
const books=[
{title:'A Journey Through Summer',category:'Artbook',pages:48,lang:'日本語',rating:'4.5',tags:['landscape','watercolor','full color'],palette:['#dce8db','#517c6b','#e6bb75'],art:0},
{title:'City Lights — Illustration Collection',category:'Artist CG',pages:72,lang:'English',rating:'4.5',tags:['cityscape','original','full color'],palette:['#dfe1ef','#6c71a0','#d8b379'],art:1},
{title:'Sketchbook: Small Everyday Stories',category:'Manga',pages:32,lang:'中文',rating:'4.0',tags:['slice of life','original','monochrome'],palette:['#eee2d6','#ad8b73','#dcc574'],art:2},
{title:'The Garden Beyond the Window',category:'Doujinshi',pages:56,lang:'日本語',rating:'5.0',tags:['botanical','original','full color'],palette:['#e6dce5','#936d85','#d7b78b'],art:3},
{title:'Cloud Atlas / Character Studies',category:'Artbook',pages:96,lang:'English',rating:'4.5',tags:['character design','original','full color'],palette:['#d8e8ed','#5993a1','#d5af71'],art:0},
{title:'Sunday Morning',category:'Manga',pages:24,lang:'English',rating:'4.0',tags:['slice of life','original','monochrome'],palette:['#e6e2d9','#9d8e75','#b2c2a3'],art:2},
{title:'Harbor Notes — Collected Drawings',category:'Artist CG',pages:64,lang:'English',rating:'4.5',tags:['landscape','watercolor','full color'],palette:['#d6e2e9','#487a96','#caa36b'],art:1}];
const plans={current:['目前 C · 對照','90% 寬卡片、154 寬封面，資訊都在標題下方。這是目前的原生排法近似示意。','比較橫向剩餘空間，以及 Frontpage 距離頂部的高度。'],a:['A · 縮窄卡片，讓下一張進入視野','卡片上限 720，封面與資訊維持現有尺寸。多出的橫向空間讓不同畫廊的下一張卡片露出。','資訊不增加、卡片不增高；代價是下一張資訊會被裁切，但更容易看出可以橫滑。'],b:['B · 放大封面，形成視覺重心','橫向封面由 154 放大到 212，卡片由 274 增高到 356，標題與資訊留在同一側。','封面更突出；代價是 Frontpage 往下移，第一屏可見內容較少。'],c:['C · 標題與資料左右分組','封面、標題與評分／語言在左，頁數／分類與 tags 移到右側，以分隔線界定。每個欄位仍只顯示一次。','維持 274 起始高度；代價是標題寬度變窄，視線需要跨兩組資訊。']};
let p=new URLSearchParams(location.search),variant=p.get('v')||'a',active=0,timer;if(!plans[variant])variant='a';
function art(b){let[bg,ink,accent]=b.palette;let drawing=b.art===0?`<circle cx="150" cy="76" r="30" fill="${accent}"/><path d="M0 243L79 130L156 225L212 158V300H0Z" fill="${ink}"/><path d="M0 277L103 191L212 264V300H0Z" fill="${accent}" opacity=".65"/>`:b.art===1?`<circle cx="166" cy="70" r="27" fill="${accent}"/><path d="M0 180H26V121H65V185H90V93H129V152H154V115H195V193H212V300H0Z" fill="${ink}"/><path d="M38 143V166M101 118V142M165 140V162M101 165V189M165 184V206" stroke="${accent}" stroke-width="8"/>`:b.art===2?`<rect x="40" y="77" width="130" height="163" rx="65" fill="${ink}"/><rect x="63" y="100" width="83" height="117" rx="40" fill="${bg}"/><circle cx="106" cy="180" r="42" fill="${accent}"/>`:`<path d="M106 270V93M106 215Q14 203 37 153Q93 146 106 215M106 168Q188 141 175 106Q112 100 106 168M106 250Q189 245 175 200Q121 190 106 250" fill="${ink}" stroke="${ink}" stroke-width="5"/><circle cx="105" cy="77" r="30" fill="${accent}"/>`;return `<div class="cover" aria-hidden="true"><svg viewBox="0 0 212 291.5"><rect width="212" height="300" fill="${bg}"/>${drawing}<text x="17" y="32" fill="${ink}" font-size="10" font-family="sans-serif" letter-spacing="2">COLLECTED WORKS</text></svg></div>`}
const rating=b=>`<span class="rating">★ ${b.rating}</span>`;
function card(i,adjacent=false){let b=books[i];return `<button class="hero ${adjacent?'adjacent':''}" data-book="${i}" ${adjacent?'tabindex="-1" aria-hidden="true"':''}>${art(b)}<div class="copy"><div class="intro"><h2 class="title">${b.title}</h2><div class="rating-language">${rating(b)}<span class="language">${b.lang}</span></div></div><div class="facts"><dl class="fields"><div><dt>Pages</dt><dd>${b.pages}</dd></div><div><dt>Category</dt><dd>${b.category}</dd></div></dl><div class="chips">${b.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div></div></button>`}
function render(){document.querySelector('#canvas').className='canvas '+(variant==='current'?'baseline':'option-'+variant);document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===variant)));let n=plans[variant];document.querySelector('#note').innerHTML=`<strong>${n[0]}</strong>　${n[1]}<br>${n[2]}<small>Portrait（834）保留目前 C 排法。僅比較 slideshow；Frontpage 僅露出一排作高度對照，下方片段已套入 Other footnote、無 uploader 與原色星號。虛構資料、HTML 示意，非原生截圖。900 的切換點僅為提案起點。</small>`;document.querySelector('#content').innerHTML=`<section class="carousel" aria-label="Slideshow"><div class="track">${card((active+books.length-1)%books.length,true)}${card(active)}${card((active+1)%books.length,true)}</div></section><div class="controls"><button id="prev" aria-label="上一張">‹</button>${books.map((_,i)=>`<span class="dot ${i===active?'on':''}"></span>`).join('')}<button id="next" aria-label="下一張">›</button></div><section class="section"><div class="sectionhead"><h2>Frontpage</h2><button data-route="Frontpage">Show All</button></div><div class="wall">${books.map((b,i)=>`<button class="wall-card" data-book="${i}">${art(b)}<div class="wall-title">${b.title}</div><div class="meta">${b.pages} pages · ${b.lang}</div></button>`).join('')}</div></section><div class="lower"><section class="section"><div class="sectionhead"><h2>Toplists</h2><button data-route="Toplists">Show All</button></div><h3>Yesterday</h3><div class="ranking">${books.slice(0,6).map((b,i)=>`<button class="rank" data-book="${i}">${art(b)}<span class="rankno">${i+1}</span><div><h3>${b.title}</h3><div class="meta">${b.category}<br>${b.pages} pages · ${b.lang}</div>${rating(b)}</div></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Other</h2></div><div class="others">${[['Popular','Browse the galleries readers are enjoying now.','Global popularity'],['Watched','Find recent uploads matching your watched tags.','Your watched tags'],['History','Return to galleries you opened recently.','Recently opened']].map(o=>`<button class="other" data-route="${o[0]}"><h3>${o[0]}</h3><p>${o[1]}</p><footer><span>${o[2]}</span><span aria-hidden="true">↗</span></footer></button>`).join('')}</div></section></div>`;document.querySelector('#prev').onclick=()=>{active=(active+books.length-1)%books.length;render()};document.querySelector('#next').onclick=()=>{active=(active+1)%books.length;render()};document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>toast('開啟 Detail：'+books[Number(b.dataset.book)].title+'（提案示意）'));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>toast('前往 '+b.dataset.route+'（沿用原生導覽）'));}
function toast(text){let t=document.querySelector('#toast');t.textContent=text;t.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('visible'),2300)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;render();p.set('v',variant);history.replaceState(null,'','?'+p)});document.querySelector('#size').onchange=e=>{document.querySelector('#canvas').style.width=`min(${e.target.value}px,100%)`;p.set('w',e.target.value);history.replaceState(null,'','?'+p)};document.querySelector('#textsize').onchange=e=>document.querySelector('#canvas').style.setProperty('--scale',e.target.value);document.querySelector('#theme').onclick=e=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.textContent=dark?'淺色':'深色'};document.querySelector('#annotate').onclick=e=>{let on=document.body.classList.toggle('annotations');e.currentTarget.setAttribute('aria-pressed',String(on))};document.querySelector('#top').onclick=()=>window.scrollTo({top:0,behavior:'instant'});document.querySelector('#refresh').onclick=()=>toast('更新整個 Home（提案示意）');if(p.has('capture'))document.body.classList.add('capture');if(p.has('w')){document.querySelector('#size').value=p.get('w');document.querySelector('#canvas').style.width=`min(${Number(p.get('w'))}px,100%)`}render();
</script></body></html>
