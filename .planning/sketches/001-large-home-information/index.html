function cover(b,extra=''){let [bg,ink,accent]=b.palette;let art=b.art===0?`<circle cx="150" cy="84" r="31" fill="${accent}"/><path d="M0 243L79 130L156 225L211 158V300H0Z" fill="${ink}"/><path d="M0 277L103 191L211 264V300H0Z" fill="${accent}" opacity=".65"/>`:b.art===1?`<circle cx="170" cy="72" r="27" fill="${accent}"/><path d="M0 180H26V121H65V185H90V93H129V152H154V115H195V193H211V300H0Z" fill="${ink}"/><path d="M38 143V166M101 118V142M165 140V162M101 165V189M165 184V206" stroke="${accent}" stroke-width="8"/>`:b.art===2?`<rect x="40" y="77" width="130" height="163" rx="70" fill="${ink}"/><rect x="63" y="100" width="83" height="117" rx="45" fill="${bg}"/><circle cx="106" cy="180" r="42" fill="${accent}"/><path d="M14 248H196" stroke="${ink}" stroke-width="4"/>`:`<path d="M106 270V93M106 215Q14 203 37 153Q93 146 106 215M106 168Q188 141 175 106Q112 100 106 168M106 250Q189 245 175 200Q121 190 106 250" fill="${ink}" stroke="${ink}" stroke-width="5"/><circle cx="105" cy="77" r="30" fill="${accent}"/>`;return `<div class="cover" aria-hidden="true"><svg viewBox="0 0 211.7 300" xmlns="http://www.w3.org/2000/svg"><rect width="211.7" height="300" fill="${bg}"/>${art}<text x="17" y="32" fill="${ink}" font-size="10" font-family="sans-serif" letter-spacing="2.1">${b.author.toUpperCase()}</text><text x="17" y="283" fill="${ink}" font-size="9" font-family="sans-serif" letter-spacing="1.5">COLLECTED WORKS</text></svg>${extra}</div>`}
function rating(b){return `<span class="rating"><span class="star">★</span> ${b.rating}</span>`}function chips(b,n=3){return `<div class="chips">${b.tags.slice(0,n).map(x=>`<span class="chip">${x}</span>`).join('')}</div>`}
function hero(){const b=books[active];let text=variant==='c'?`<div class="hero-meta">${rating(b)}<span class="meta">${b.lang}</span></div><div class="detail-grid"><div><span>Uploader</span><b>${b.author}</b></div><div><span>Pages</span><b>${b.pages} pages</b></div><div><span>Posted</span><b>${b.date}</b></div><div><span>Category</span><b>${b.category}</b></div></div>${chips(b)}`:`<div class="meta">${b.author} · ${b.date}</div><div class="hero-meta"><span class="meta">${b.category} · ${b.pages} pages · ${b.lang}</span>${rating(b)}</div>${chips(b)}`;const copy=variant==='b2'?`<div class="hero-layout"><h2>${b.title}</h2><dl class="hero-fields"><div><dt>Category</dt><dd>${b.category}</dd></div><div><dt>Pages</dt><dd>${b.pages} pages</dd></div><div><dt>Language</dt><dd>${b.lang}</dd></div><div><dt>Rating</dt><dd>${rating(b)}</dd></div></dl>${chips(b)}</div>`:`<div class="eyebrow">Popular</div><h2>${b.title}</h2>${text}`;return `<div class="hero-rail" data-note="Slideshow：${{a:244,b:312,c:274,b2:312}[variant]} 高；B 修訂僅在文字區 ≥ 1000 時分組（提案值）"><button class="hero" data-gallery="${active}">${cover(b)}<div class="hero-copy">${copy}</div></button></div><div class="slide-controls"><button id="prev" aria-label="Previous gallery">‹</button>${[0,1,2,3].map(i=>`<span class="dot ${active===i?'on':''}"></span>`).join('')}<button id="next" aria-label="Next gallery">›</button></div>`}
function wallCard(b,i){let extra=variant==='a'?`<span class="cover-label">${b.pages} p · ${b.lang==='English'?'EN':b.lang==='日本語'?'JA':'ZH'}</span>`:'';let body=variant==='a'?`<div class="meta" style="margin-top:8px">${b.category}</div><div class="meta">${rating(b)} · ${b.author}</div>`:(variant==='b'||variant==='b2')?`<div class="wall-copy"><div class="wall-title">${b.title}</div><div class="meta">${b.pages} p · ${b.lang}</div></div>`:`<div class="wall-copy"><div class="wall-title">${b.title}</div><div class="meta">${b.author}<br>${b.pages} p · ${b.lang}<br>${rating(b)} · ${b.category}</div><span class="chip">${b.tags[0]}</span></div>`;return `<button class="wall-card" data-gallery="${i}" aria-label="${b.title}, ${b.pages} pages, ${b.lang}">${cover(b,extra)}${body}</button>`}
function rank(b,i,idx){return `<button class="rank-row" data-gallery="${idx}">${cover(b)}<span class="rankno">${i+1}</span><div class="rank-copy"><div class="rank-title">${b.title}</div><div class="meta">${b.author}</div><div class="rank-meta"><span>${b.category} · ${b.pages} p · ${b.lang}</span>${rating(b)}</div>${variant==='c'?chips(b,2):''}</div></button>`}
function other(){return [{name:'Popular',icon:'<svg viewBox="0 0 28 28"><path d="M16 2C16 10 5 10 5 18A9 9 0 0 0 23 18C23 14 21 11 19 9C20 17 12 16 16 2Z"/><path d="M14 16C14 20 10 20 10 23A4 4 0 0 0 18 23C18 20 15 19 14 16Z"/></svg>',text:'Browse the galleries readers are enjoying now.',foot:'Global popularity',row:['Source','Popular galleries']},{name:'Watched',icon:'<svg viewBox="0 0 28 28"><path d="M4 4H15L25 14L14 25L4 15Z"/><circle cx="9" cy="9" r="1.5"/></svg>',text:'Find recent uploads matching your watched tags.',foot:'Your watched tags',row:['Matches','Your tag list']},{name:'History',icon:'<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10"/><path d="M14 7V14L19 17"/></svg>',text:'Return to galleries you opened recently.',foot:'Recently opened',row:['Order','Last opened first']}].map(o=>`<button class="other-card" data-route="${o.name}" data-note="${o.name}：目的地說明，無新增即時統計請求"><div><div class="other-heading"><h3>${o.name}</h3><span class="other-icon" aria-hidden="true">${o.icon}</span></div><p>${o.text}</p></div>${(variant==='b'||variant==='b2')?`<div class="other-foot">${o.foot} <span style="float:right">↗</span></div>`:variant==='c'?`<div class="other-list"><span>${o.row[0]}</span><b>${o.row[1]}</b></div>`:''}</button>`).join('')}
function section(title,body,note=''){return `<section class="section" data-note="${note}"><div class="sectionhead"><h2>${title}</h2>${title==='Other'?'':`<button data-route="${title}">Show All</button>`}</div>${body}</section>`}
function render(){document.getElementById('canvas').className='canvas '+(variant==='b2'?'b revised':variant);document.getElementById('reviewnote').innerHTML=notes[variant]+(variant==='b2'?'':'<br>原始方案留存比較；slideshow 欄位已由 B 修訂更新。')+'<br>順序與導覽框架固定。示範內容與封面皆為虛構；尺寸為一般字級的起始值。';document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.getElementById('home').innerHTML=hero()+section('Frontpage',`<div class="wall">${books.map(wallCard).join('')}</div>`,'Frontpage：仍為兩排橫向捲動；比較封面大小與文字位置')+section('Toplists',`<div class="ranking-rail">${['Yesterday','Past Month','Past Year','All Time'].map((name,g)=>`<div class="rank-group"><h3>${name}</h3><div class="ranking-grid">${books.slice(g,g+6).map((b,i)=>rank(b,i,i+g)).join('')}</div></div>`).join('')}</div>`,'Toplists：每分類仍為 2 欄 × 3 筆；比較封面和 metadata')+section('Other',`<div class="other-grid">${other()}</div>`,'Other：保留 Popular／Watched／History 三個入口')+'<div class="legend">設計示意 · 本頁用來比較 section 內資訊呈現，並非原生 app 實作。所有數據為示範內容。</div>';document.getElementById('prev').onclick=()=>{active=(active+3)%4;render()};document.getElementById('next').onclick=()=>{active=(active+1)%4;render()};document.querySelectorAll('[data-gallery]').forEach(b=>b.onclick=()=>toast('開啟 Detail：'+books[Number(b.dataset.gallery)].title+'（示意，保留現有導覽）'));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>toast('前往 '+b.dataset.route+' 清單（示意，保留現有導覽）'))}
function focusSection(){const value=document.getElementById('focus').value;const target=value==='hero'?document.querySelector('.hero-rail'):value==='all'?null:[...document.querySelectorAll('.section')].find(e=>e.querySelector('h2').textContent===value);window.scrollTo({top:target?target.getBoundingClientRect().top+window.scrollY-100:0,behavior:'instant'})}document.getElementById('focus').onchange=focusSection;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2400)}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;render();history.replaceState(null,'','?v='+variant);focusSection()});document.getElementById('size').onchange=e=>{document.getElementById('canvas').style.width='min('+e.target.value+'px,100%)'};document.getElementById('theme').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.setAttribute('aria-pressed',dark);e.currentTarget.textContent=dark?'淺色':'深色'};document.getElementById('annotate').onclick=e=>{annotations=!annotations;document.body.classList.toggle('annotations',annotations);e.currentTarget.setAttribute('aria-pressed',annotations);if(!annotations)document.getElementById('anno').style.display='none'};document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.getElementById('refresh').onclick=()=>toast('更新整個 Home：Slideshow、Frontpage 與 Toplists（示意）');document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-note]'),a=document.getElementById('anno');if(!annotations||!el){a.style.display='none';return}a.textContent=el.dataset.note;a.style.display='block';a.style.left=Math.min(e.clientX+14,window.innerWidth-430)+'px';a.style.top=e.clientY+18+'px'});if(params.has('capture'))document.body.classList.add('capture');if(params.has('w')){document.getElementById('canvas').style.width='min('+Number(params.get('w'))+'px,100%)';document.getElementById('size').value=params.get('w')}render();
</script></body></html>
